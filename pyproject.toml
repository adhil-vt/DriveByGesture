[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name        = "gesturedrive"
version     = "0.1.0"
description = "Control PC racing games with real-time hand gestures."
readme      = "README.md"
requires-python = ">=3.11"
license     = { text = "MIT" }

dependencies = [
    # Computer vision
    "opencv-python>=4.9",
    "mediapipe>=0.10",

    # Virtual controller
    "vgamepad>=0.1.0",

    # Configuration
    # tomllib is stdlib in Python 3.11+; no extra dependency needed.

    # Hot-reload for config
    "watchdog>=4.0",

    # Diagnostics
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "hypothesis>=6.100",
    "mypy>=1.9",
    "ruff>=0.4",
]

[project.scripts]
gesturedrive = "gesturedrive.__main__:main"

# ── Game plugin entry points ──────────────────────────────────────────────────
# Third-party game plugins register here.
# First-party plugins are also listed for discoverability.
[project.entry-points."gesturedrive.games"]
forza_horizon = "games.forza_horizon.plugin:ForzaHorizonPlugin"

# ── Tool configuration ────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths    = ["tests"]
python_files = ["test_*.py"]
addopts      = "-v --tb=short"

[tool.mypy]
python_version         = "3.11"
strict                 = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "B", "SIM"]
